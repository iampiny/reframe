<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frame Home</title>
    <link rel="stylesheet" href="styles.css">
    <!-- FRAME_LAYOUT -->
</head>
  <body style="background-color: #0c0e14">
    <div style="background-color: #0c0e14; box-sizing: border-box; height: 1080px; overflow: hidden; position: relative; width: 1920px" data-ui="home-scene-shared">
      <div style="background-image: radial-gradient(ellipse 50% 50% at 10% 6%, #647da480 0%, #00000000 60%), radial-gradient(ellipse 50% 50% at 96% 92%, #785b8166 0%, #00000000 62%), linear-gradient(134.254deg, #232c3c 18.521%, #171d2b 53.148%, #2c283a 81.479%); background-repeat: no-repeat, no-repeat, no-repeat; background-size: 100% 100%, 100% 100%, 100% 100%; box-sizing: border-box; height: 1080px; left: 0px; position: absolute; top: 0px; width: 1920px; z-index: 0" data-ui="ambient-background"></div>
      <div style="box-sizing: border-box; height: 1080px; left: 0px; position: absolute; top: 0px; width: 1920px; z-index: 1" data-ui="featured-artwork">
        <div style="background-image: linear-gradient(104.697deg, #07090edb 7.794%, #07090e80 33.118%, #00000000 56.753%), linear-gradient(0deg, #06080df2 0%, #06080dbf 20%, #00000000 46%); background-repeat: no-repeat, no-repeat; background-size: 100% 100%, 100% 100%; box-sizing: border-box; height: 1080px; left: 0px; position: absolute; top: 0px; width: 1920px; z-index: 0" data-ui="artwork-scrim"></div>
      </div>
      <div style="background-color: #111722; box-sizing: border-box; height: 1080px; left: 0px; opacity: 0; overflow: hidden; position: absolute; top: 0px; width: 1920px; z-index: 2" data-ui="app-background">
        <div style="background-image: radial-gradient(ellipse 70% 100% at 65% 28%, #76b90040 0%, #76b9001a 45%, #76b90000 85%), radial-gradient(ellipse 60% 80% at 86% 88%, #76b9001f 0%, #76b90000 85%); background-repeat: no-repeat, no-repeat; background-size: 100% 100%, 100% 100%; box-sizing: border-box; height: 1080px; left: 0px; position: absolute; top: 0px; width: 1920px; z-index: 0" data-ui="app-background-glow"></div>
      </div>
      <div style="box-sizing: border-box; height: 880px; position: absolute; top: 144px; z-index: 3" data-ui="selected-app-preview">
        <div style="box-sizing: border-box; color: #d3d8e3; font-family: Inter, system-ui, sans-serif; font-size: 22px; font-style: normal; font-weight: 500; left: 0px; letter-spacing: -0.3px; line-height: 26px; opacity: 0; position: absolute; text-align: left; top: 0px; white-space: nowrap; z-index: 0" data-ui="preview-eyebrow"></div>
        <div style="box-sizing: border-box; color: #f6f7fb; font-family: Inter, system-ui, sans-serif; font-size: 46px; font-style: normal; font-weight: 600; left: 0px; letter-spacing: -1px; line-height: 48px; position: absolute; text-align: left; top: 0px; white-space: nowrap; z-index: 1" data-ui="preview-title"></div>
        <div style="box-sizing: border-box; color: #d3d8e3; font-family: Inter, system-ui, sans-serif; font-size: 26px; font-style: normal; font-weight: 400; left: 0px; letter-spacing: -0.4px; line-height: 36px; opacity: 0; position: absolute; text-align: left; top: 60px; white-space: nowrap; z-index: 2" data-ui="preview-description"></div>
        <div style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; gap: 36px; height: 776px; justify-content: flex-start; left: 0px; position: absolute; top: 104px; width: 1248px; z-index: 3" data-ui="content-rows">
          <div style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 16px; justify-content: flex-start" data-ui="content-row">
            <div style="box-sizing: border-box; color: #f6f7fb; flex-shrink: 0; font-family: Inter, system-ui, sans-serif; font-size: 30px; font-style: normal; font-weight: 500; height: 40px; letter-spacing: 0px; line-height: normal; text-align: left" data-ui="content-row-heading"></div>
            <div style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 24px; justify-content: flex-start" data-ui="content-cards">
              <div style="box-sizing: border-box; flex-shrink: 0; position: relative" data-ui="content-card">
                <div style="background-color: #20242d; border-radius: 16px; box-sizing: border-box; left: 0px; position: absolute; top: 0px; z-index: 0" data-ui="content-artwork"></div>
                <div style="box-sizing: border-box; color: #f6f7fb; font-family: Inter, system-ui, sans-serif; font-size: 26px; font-style: normal; font-weight: 500; height: 36px; left: 0px; letter-spacing: 0px; line-height: normal; position: absolute; text-align: left; top: 194px; z-index: 1" data-ui="content-title"></div>
                <div style="box-sizing: border-box; color: #a4aec0; font-family: Inter, system-ui, sans-serif; font-size: 21px; font-style: normal; font-weight: 400; height: 28px; left: 0px; letter-spacing: 0px; line-height: normal; position: absolute; text-align: left; top: 236px; z-index: 2" data-ui="content-subtitle"></div>
              </div>
            </div>
          </div>
          <div style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 16px; justify-content: flex-start" data-ui="content-row">
            <div style="box-sizing: border-box; color: #f6f7fb; flex-shrink: 0; font-family: Inter, system-ui, sans-serif; font-size: 30px; font-style: normal; font-weight: 500; height: 40px; letter-spacing: 0px; line-height: normal; text-align: left" data-ui="content-row-heading"></div>
            <div style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 24px; justify-content: flex-start" data-ui="content-cards">
              <div style="box-sizing: border-box; flex-shrink: 0; position: relative" data-ui="content-card">
                <div style="background-color: #20242d; border-radius: 16px; box-sizing: border-box; left: 0px; position: absolute; top: 0px; z-index: 0" data-ui="content-artwork"></div>
                <div style="box-sizing: border-box; color: #f6f7fb; font-family: Inter, system-ui, sans-serif; font-size: 26px; font-style: normal; font-weight: 500; height: 36px; left: 0px; letter-spacing: 0px; line-height: normal; position: absolute; text-align: left; top: 194px; z-index: 1" data-ui="content-title"></div>
                <div style="box-sizing: border-box; color: #a4aec0; font-family: Inter, system-ui, sans-serif; font-size: 21px; font-style: normal; font-weight: 400; height: 28px; left: 0px; letter-spacing: 0px; line-height: normal; position: absolute; text-align: left; top: 236px; z-index: 2" data-ui="content-subtitle"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div style="box-sizing: border-box; color: #f6f7fb; font-family: Inter, system-ui, sans-serif; font-style: normal; font-weight: 500; letter-spacing: -0.8px; line-height: 43px; position: absolute; text-align: right; z-index: 5" data-ui="clock"></div>
      <div style="background-image: linear-gradient(90deg, #080a10ed 0%, #080a10d1 55%, #080a1000 100%); background-repeat: no-repeat; background-size: 100% 100%; box-sizing: border-box; position: absolute; z-index: 5" data-ui="sidebar-always-open">
        <div style="box-sizing: border-box; overflow: hidden; position: absolute; z-index: 0" data-ui="navigation-viewport">
          <div style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; gap: 38px; justify-content: flex-start; position: absolute; z-index: 0" data-ui="pinned-navigation-list">
            <div style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 20px; justify-content: flex-start" data-ui="streaming-apps">
              <div style="box-sizing: border-box; flex-shrink: 0; position: relative" data-ui="netflix-tile">
                <span class="app-name-fallback">Netflix</span>
              </div>
              <div style="box-sizing: border-box; flex-shrink: 0; position: relative" data-ui="youtube-tile">
                <span class="app-name-fallback">YouTube</span>
              </div>
              <div style="box-sizing: border-box; flex-shrink: 0; position: relative" data-ui="plex-tile">
                <span class="app-name-fallback">Plex</span>
              </div>
              <div style="box-sizing: border-box; flex-shrink: 0; position: relative" data-ui="geforce-now-tile">
                <span class="app-name-fallback">GeForce NOW</span>
              </div>
            </div>
            <div style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 8px; justify-content: flex-start" data-ui="tv-controls">
              <div style="align-items: center; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 16px; justify-content: flex-start; position: relative" data-ui="artwork-action">
                <svg viewbox="0 0 240 56" preserveaspectratio="none" xmlns="http://www.w3.org/2000/svg" style="box-sizing: border-box; opacity: 0; overflow: visible; position: absolute; z-index: 0" data-ui="action-surface">
                  <path d="M 38 0 H 202 C 222 0 230 0 235 6 C 240 12 240 16 240 24 V 32 C 240 40 240 44 235 50 C 230 56 222 56 202 56 H 38 C 18 56 10 56 5 50 C 0 44 0 40 0 32 V 24 C 0 16 0 12 5 6 C 10 0 18 0 38 0 Z" fill="#ffffff0d"></path>
                </svg>
                <img src="control-artwork.svg" alt="" aria-hidden="true" style="box-sizing: border-box; flex-shrink: 0; opacity: 0.6; position: relative; z-index: 1" data-ui="action-icon">
                <div style="box-sizing: border-box; color: #f5f5f7; display: flex; flex-direction: column; flex: 1 1 0; font-family: Inter, system-ui, sans-serif; font-style: normal; font-weight: 500; justify-content: center; letter-spacing: -0.3px; line-height: normal; position: relative; text-align: left; z-index: 2" data-ui="action-label">Artwork</div>
              </div>
              <div style="align-items: center; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 16px; justify-content: flex-start; position: relative" data-ui="apps-action">
                <svg viewbox="0 0 240 56" preserveaspectratio="none" xmlns="http://www.w3.org/2000/svg" style="box-sizing: border-box; opacity: 0; overflow: visible; position: absolute; z-index: 0" data-ui="action-surface">
                  <path d="M 38 0 H 202 C 222 0 230 0 235 6 C 240 12 240 16 240 24 V 32 C 240 40 240 44 235 50 C 230 56 222 56 202 56 H 38 C 18 56 10 56 5 50 C 0 44 0 40 0 32 V 24 C 0 16 0 12 5 6 C 10 0 18 0 38 0 Z" fill="#ffffff0d"></path>
                </svg>
                <img src="control-store.svg" alt="" aria-hidden="true" style="box-sizing: border-box; flex-shrink: 0; opacity: 0.6; position: relative; z-index: 1" data-ui="action-icon">
                <div style="box-sizing: border-box; color: #f5f5f7; display: flex; flex-direction: column; flex: 1 1 0; font-family: Inter, system-ui, sans-serif; font-style: normal; font-weight: 500; justify-content: center; letter-spacing: -0.3px; line-height: normal; position: relative; text-align: left; z-index: 2" data-ui="action-label">Apps</div>
              </div>
              <div style="align-items: center; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 16px; justify-content: flex-start; position: relative" data-ui="settings-action">
                <svg viewbox="0 0 240 56" preserveaspectratio="none" xmlns="http://www.w3.org/2000/svg" style="box-sizing: border-box; opacity: 0; overflow: visible; position: absolute; z-index: 0" data-ui="action-surface">
                  <path d="M 38 0 H 202 C 222 0 230 0 235 6 C 240 12 240 16 240 24 V 32 C 240 40 240 44 235 50 C 230 56 222 56 202 56 H 38 C 18 56 10 56 5 50 C 0 44 0 40 0 32 V 24 C 0 16 0 12 5 6 C 10 0 18 0 38 0 Z" fill="#ffffff0d"></path>
                </svg>
                <img src="control-settings.svg" alt="" aria-hidden="true" style="box-sizing: border-box; flex-shrink: 0; opacity: 0.6; position: relative; z-index: 1" data-ui="action-icon">
                <div style="box-sizing: border-box; color: #f5f5f7; display: flex; flex-direction: column; flex: 1 1 0; font-family: Inter, system-ui, sans-serif; font-style: normal; font-weight: 500; justify-content: center; letter-spacing: -0.3px; line-height: normal; position: relative; text-align: left; z-index: 2" data-ui="action-label">Settings</div>
              </div>
              <div style="align-items: center; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 16px; justify-content: flex-start; position: relative" data-ui="samsung-ui-action">
                <svg viewbox="0 0 240 56" preserveaspectratio="none" xmlns="http://www.w3.org/2000/svg" style="box-sizing: border-box; opacity: 0; overflow: visible; position: absolute; z-index: 0" data-ui="action-surface">
                  <path d="M 38 0 H 202 C 222 0 230 0 235 6 C 240 12 240 16 240 24 V 32 C 240 40 240 44 235 50 C 230 56 222 56 202 56 H 38 C 18 56 10 56 5 50 C 0 44 0 40 0 32 V 24 C 0 16 0 12 5 6 C 10 0 18 0 38 0 Z" fill="#ffffff0d"></path>
                </svg>
                <img src="control-samsung.svg" alt="" aria-hidden="true" style="box-sizing: border-box; flex-shrink: 0; opacity: 0.6; position: relative; z-index: 1" data-ui="action-icon">
                <div style="box-sizing: border-box; color: #f5f5f7; display: flex; flex-direction: column; flex: 1 1 0; font-family: Inter, system-ui, sans-serif; font-style: normal; font-weight: 500; justify-content: center; letter-spacing: -0.3px; line-height: normal; position: relative; text-align: left; z-index: 2" data-ui="action-label">Samsung UI</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div style="box-sizing: border-box; position: absolute; z-index: 6" data-ui="brightness-control">
        <div style="box-sizing: border-box; opacity: 0; position: absolute; z-index: 0" data-ui="brightness-sheet">
          <div style="background-color: #0c0e14de; border-radius: 36px; box-sizing: border-box; position: absolute; z-index: 0" data-ui="brightness-surface"></div>
          <div style="background-color: #ffffff26; border-radius: 3px; box-sizing: border-box; position: absolute; z-index: 1" data-ui="brightness-track"></div>
          <div style="background-color: #f6f7fb; border-radius: 3px; box-sizing: border-box; height: 131.6px; position: absolute; top: 142.4px; z-index: 2" data-ui="brightness-fill"></div>
          <div style="background-color: #f6f7fb; border-radius: 50%; box-sizing: border-box; position: absolute; top: 135.4px; z-index: 3" data-ui="brightness-thumb"></div>
          <img src="brightness-dim-icon.svg" alt="" aria-hidden="true" style="box-sizing: border-box; position: absolute; z-index: 4" data-ui="brightness-dim-icon">
          <div style="align-items: center; border-radius: 36px; box-sizing: border-box; display: flex; flex-direction: row; gap: 0px; justify-content: center; position: absolute; z-index: 5" data-ui="brightness-auto-button">
            <img src="brightness-auto.svg" alt="" aria-hidden="true" style="box-sizing: border-box; flex-shrink: 0; position: relative; z-index: 2" data-ui="brightness-auto-icon">
            <img src="brightness-auto-on.svg" alt="" aria-hidden="true" style="box-sizing: border-box; position: absolute; z-index: 2" data-ui="brightness-auto-icon-on">
            <div style="background-color: #0c0e14d9; border-radius: 36px; box-sizing: border-box; opacity: 0; position: absolute; z-index: 1" data-ui="brightness-auto-focus-surface"></div>
          </div>
          <div style="background-color: #0c0e14d9; border-radius: 36px; box-sizing: border-box; opacity: 0; position: absolute; z-index: 0" data-ui="brightness-focus-surface"></div>
        </div>
        <img src="brightness-icon.svg" alt="" aria-hidden="true" style="box-sizing: border-box; position: absolute; z-index: 1" data-ui="brightness-icon">
      </div>
    </div>

  </body>
